version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    ignore:
      # o SDK do Stripe só sobe de versão maior de propósito, com apiVersion e compra de teste (story SA-7.1)
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
