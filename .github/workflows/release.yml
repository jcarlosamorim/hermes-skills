name: Release zips (portable)

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: A tag tem que ser a versão do catálogo, e os comandos têm que apontar para ela
        run: |
          v="v$(python3 -c 'import json; print(json.load(open("catalog.json"))["version"])')"
          if [ "$GITHUB_REF_NAME" != "$v" ]; then echo "::error::tag $GITHUB_REF_NAME != catalog.version $v"; exit 1; fi
          n=$(grep -c "/${GITHUB_REF_NAME}/skills/" catalog.json || true)
          if [ "$n" -lt 50 ]; then echo "::error::só $n install_url apontam para $GITHUB_REF_NAME"; exit 1; fi
      - run: python3 scripts/validate_skills.py
      - run: python3 scripts/scan_skills.py
      - run: python3 scripts/build_docs.py
      - name: Anexa um zip por skill à release da tag (Claude.ai e ChatGPT instalam por upload)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "AgentFlix ${GITHUB_REF_NAME}" --notes "Zips portable (spec agentskills.io) de cada skill, para upload no Claude.ai e no ChatGPT."
          gh release upload "${GITHUB_REF_NAME}" dist/portable/*.zip --clobber
