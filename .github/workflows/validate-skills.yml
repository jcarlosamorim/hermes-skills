name: Validate community skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests
      - name: site/ (vitrine, player, api) compila e os JSON são válidos; era o único caminho sem gate
        run: python3 scripts/check_site.py
      - run: python3 scripts/validate_skills.py
      - run: python3 scripts/scan_skills.py
      - name: docs/ e catalog.json têm que ser o build de skills/ (o Pages serve o que está commitado)
        run: |
          python3 scripts/build_docs.py
          if [ -n "$(git status --porcelain -- docs catalog.json)" ]; then
            git status --short -- docs catalog.json | head -20
            echo "::error::docs/ ou catalog.json desatualizados: rode python3 scripts/build_docs.py e commite o resultado"
            exit 1
          fi
